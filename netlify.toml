# Netlify: сборка и раздача статики (решение 392)
#
# Конвейер здесь не запускается: замеры доверяем только Mac из-за шрифтов,
# ворота работают локально до пуша. Netlify делает одно — собирает то, что
# уже проверено, и раздаёт.
#
# Формы: атрибуты data-netlify в разметке Netlify читает на этапе деплоя.
# Заявки хранятся в панели и дублируются на почту (решение 390).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Ветки и PR: каждый получает свой адрес — это бесплатный staging.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Служебные страницы студии не индексируются: они для работы, не для выдачи.
[[headers]]
  for = "/structure.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/ds.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/spasibo.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
